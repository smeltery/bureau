apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../kubernetes
images:
  - name: ghcr.io/smeltery/bureau
    digest: sha256:ad222c8028b35076cd102cc2baf3ff1b738ab537a109bcc7c3a4ead11b5185d1
configMapGenerator:
  - name: bureau-config
    namespace: bureau
    behavior: replace
    literals:
      - BUREAU_PUBLIC_URL=https://office.k8s.test
patches:
  - target:
      kind: Ingress
      name: bureau
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: office.k8s.test
      - op: replace
        path: /spec/rules/1/host
        value: "*.office.k8s.test"
      - op: replace
        path: /metadata/annotations/alb.ingress.kubernetes.io~1certificate-arn
        value: arn:aws:acm:REGION:ACCOUNT:certificate/REPLACE_WITH_CERTIFICATE_ID
