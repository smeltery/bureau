apiVersion: apps/v1
kind: Deployment
metadata:
  name: bureau
  namespace: bureau
  labels:
    app.kubernetes.io/name: bureau
spec:
  # One replica only. Recreate stops the old pod before a rollout starts the
  # new one; the ReadWriteOncePod claim stops a second pod in other cases.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bureau
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bureau
    spec:
      serviceAccountName: bureau
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/os: linux
        bureau.com/office-node: "true"
      # The image is published for these two architectures.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: [amd64, arm64]
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        # Written to each office node by the bureau-seccomp-installer DaemonSet.
        seccompProfile:
          type: Localhost
          localhostProfile: bureau/bureau-chromium-v1.json
      containers:
        - name: office
          image: ghcr.io/dotbrains/bureau
          ports:
            - name: http
              containerPort: 10000
          env:
            - name: PORT
              value: "10000"
            - name: BUREAU_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: bureau-config
                  key: BUREAU_PUBLIC_URL
            # Needed until the first owner exists. Delete the Secret after
            # that; the next pod start drops it from the environment.
            - name: BUREAU_SETUP_KEY
              valueFrom:
                secretKeyRef:
                  name: bureau-setup
                  key: BUREAU_SETUP_KEY
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /var/data
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bureau-data
