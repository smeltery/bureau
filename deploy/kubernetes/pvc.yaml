# One writer: ReadWriteOncePod lets only one pod use the claim, also while an
# old pod is still terminating. Never force-delete the office pod.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bureau-data
  namespace: bureau
spec:
  accessModes: [ReadWriteOncePod]
  storageClassName: bureau-gp3
  resources:
    requests:
      storage: 30Gi
