# Writes the office's seccomp profile to each office node, where kubelet reads
# Localhost profiles. Not privileged: root with no capabilities, one hostPath.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: bureau-seccomp-installer
  namespace: bureau-node-setup
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: bureau-seccomp-installer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bureau-seccomp-installer
    spec:
      serviceAccountName: bureau-seccomp-installer
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 5
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/os: linux
        bureau.com/office-node: "true"
      containers:
        - name: install
          # The office image: already on the node, and it has bash and coreutils.
          image: ghcr.io/dotbrains/bureau
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              name=bureau-chromium-v1.json
              cp "/profile/$name" "/host/.$name.tmp"
              chmod 0644 "/host/.$name.tmp"
              mv -f "/host/.$name.tmp" "/host/$name"
              exec sleep infinity
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - cmp -s /profile/bureau-chromium-v1.json /host/bureau-chromium-v1.json
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: profile
              mountPath: /profile
              readOnly: true
            - name: host
              mountPath: /host
      volumes:
        - name: profile
          configMap:
            name: bureau-seccomp
        - name: host
          hostPath:
            path: /var/lib/kubelet/seccomp/bureau
            type: DirectoryOrCreate
