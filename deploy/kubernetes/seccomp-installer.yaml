# Writes the office's seccomp profile to each office node, where kubelet reads
# Localhost profiles. Not privileged: root with no capabilities, one hostPath.
# The ConfigMap has one profile per node architecture, keyed by `uname -m`; a
# node with no matching key gets no file and the installer is not Ready.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: bureau-seccomp-installer
  namespace: bureau-node-setup
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: bureau-seccomp-installer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bureau-seccomp-installer
    spec:
      serviceAccountName: bureau-seccomp-installer
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 5
      nodeSelector:
        kubernetes.io/os: linux
        bureau.com/office-node: "true"
      # The image is published for these two architectures.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: [amd64, arm64]
      containers:
        - name: install
          # The office image: already on the node, and it has bash and coreutils.
          image: ghcr.io/dotbrains/bureau
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              name=bureau-chromium-v1.json
              profile="/profile/$(uname -m).json"
              [[ -f $profile ]] || { echo "No seccomp profile for $(uname -m)" >&2; exit 1; }
              cp "$profile" "/host/.$name.tmp"
              chmod 0644 "/host/.$name.tmp"
              mv -f "/host/.$name.tmp" "/host/$name"
              exec sleep infinity
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - cmp -s "/profile/$(uname -m).json" /host/bureau-chromium-v1.json
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: profile
              mountPath: /profile
              readOnly: true
            - name: host
              mountPath: /host
      volumes:
        - name: profile
          configMap:
            name: bureau-seccomp
        - name: host
          hostPath:
            path: /var/lib/kubelet/seccomp/bureau
            type: DirectoryOrCreate
