# No RBAC is bound to this account, and pods do not mount its token: agents
# run arbitrary commands and must not reach the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bureau
  namespace: bureau
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bureau-seccomp-installer
  namespace: bureau-node-setup
automountServiceAccountToken: false
