# Prototype: validate in a Render workspace before production use.
services:
  - type: web
    name: bureau
    runtime: docker
    plan: pro
    dockerfilePath: ./deploy/render/Dockerfile
    autoDeployTrigger: off
    disk:
      name: bureau-data
      mountPath: /var/data
      sizeGB: 20
    envVars:
      - key: BUREAU_PUBLIC_URL
        sync: false
      - key: BUREAU_SETUP_KEY
        generateValue: true
# Add the office custom domain and *.office-domain to this same service.
# Generated apps execute on distinct origins. An onrender.com address alone
# cannot supply those child hostnames. Provider login happens inside Bureau.
