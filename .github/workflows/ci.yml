name: App CI

# Quality gate for the root Bun/Flox app. Website validation lives in
# website-ci.yml so npm/Next checks do not overlap with this job.
on:
  pull_request:
    paths-ignore:
      - "website/**"
      - "vercel.json"
  push:
    branches: [master]
    paths-ignore:
      - "website/**"
      - "vercel.json"

# Cancel in-flight runs for the same PR / branch when a new commit lands.
concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

# Lock down default permissions; this workflow only needs read access.
permissions:
  contents: read

jobs:
  ci:
    name: app-ci
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-flox
      - name: Typecheck
        run: flox activate -- bun run typecheck
      - name: Lint
        run: flox activate -- bun run lint
      - name: Format check
        run: flox activate -- bun run format:check
      - name: Test
        run: flox activate -- bun run test
      - name: Build UI
        run: flox activate -- bun run build:ui
      - name: Build server
        run: flox activate -- bun run build:server
