name: CI

on:
  pull_request:
    paths:
      - "api/**"
      - "demo/**"
      - "scripts/**"
      - "server/**"
      - "shared/**"
      - "skills/**"
      - "ui/**"
      - ".flox/**"
      - ".github/workflows/**"
      - ".githooks/**"
      - ".github/actionlint.yaml"
      - "bun.lock"
      - "package.json"
      - "tsconfig.json"
      - "website/**"
      - "vercel.json"
  push:
    branches: [master]
    paths:
      - "api/**"
      - "demo/**"
      - "scripts/**"
      - "server/**"
      - "shared/**"
      - "skills/**"
      - "ui/**"
      - ".flox/**"
      - ".github/workflows/**"
      - ".githooks/**"
      - ".github/actionlint.yaml"
      - "bun.lock"
      - "package.json"
      - "tsconfig.json"
      - "website/**"
      - "vercel.json"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.changed.outputs.app }}
      website: ${{ steps.changed.outputs.website }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        name: Detect changed areas
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [[ "$base" =~ ^0+$ ]]; then
              base="$(git rev-list --max-parents=0 "$head")"
            fi
          fi

          changed_files="$(git diff --name-only "$base" "$head")"

          app=false
          website=false
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              website/*|vercel.json|.github/workflows/*|.github/actionlint.yaml)
                website=true
                ;;
            esac
            case "$path" in
              api/*|demo/*|scripts/*|server/*|shared/*|skills/*|ui/*|.flox/*|.githooks/*|bun.lock|package.json|tsconfig.json|.github/workflows/*|.github/actionlint.yaml)
                app=true
                ;;
            esac
          done <<< "$changed_files"

          {
            echo "app=$app"
            echo "website=$website"
          } >> "$GITHUB_OUTPUT"

  app-ci:
    name: app-ci
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: flox/install-flox-action@v2
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('.flox/env/manifest.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install app dependencies
        run: flox activate -- bun install --frozen-lockfile
      - name: Run app CI
        run: flox activate -- bun run ci

  website-ci:
    name: website-ci
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run ci
