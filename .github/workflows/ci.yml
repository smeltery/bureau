name: App CI

# Quality gate for the root Bun/Flox app. Website validation lives in
# website-ci.yml so npm/Next checks do not overlap with this job.
on:
  pull_request:
    paths:
      - "api/**"
      - "demo/**"
      - "scripts/**"
      - "server/**"
      - "shared/**"
      - "skills/**"
      - "ui/**"
      - ".flox/**"
      - ".github/workflows/ci.yml"
      - ".githooks/**"
      - "bun.lock"
      - "package.json"
      - "tsconfig.json"
  push:
    branches: [master]
    paths:
      - "api/**"
      - "demo/**"
      - "scripts/**"
      - "server/**"
      - "shared/**"
      - "skills/**"
      - "ui/**"
      - ".flox/**"
      - ".github/workflows/ci.yml"
      - ".githooks/**"
      - "bun.lock"
      - "package.json"
      - "tsconfig.json"

# Cancel in-flight runs for the same PR / branch when a new commit lands.
concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

# Lock down default permissions; this workflow only needs read access.
permissions:
  contents: read

jobs:
  ci:
    name: app-ci
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: flox/install-flox-action@v2
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('.flox/env/manifest.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install app dependencies
        run: flox activate -- bun install --frozen-lockfile
      - name: Run app CI
        run: flox activate -- bun run ci
