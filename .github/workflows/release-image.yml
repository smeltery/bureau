name: release-image

# Publishes the office image that the Kubernetes and container hosting guides
# deploy: ghcr.io/smeltery/bureau, for amd64 and arm64. Release tags (v*) get
# an image tag of the same name; deployments pin the digest the run reports.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/smeltery/bureau
          tags: |
            type=ref,event=tag
            type=sha,format=long
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/render/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=bureau-release
          cache-to: type=gha,mode=max,scope=bureau-release
      - name: Report the digest to pin
        run: |
          {
            echo "### ghcr.io/smeltery/bureau"
            echo
            echo "Pin this digest in your kustomization.yaml:"
            echo
            echo '```'
            echo "${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
