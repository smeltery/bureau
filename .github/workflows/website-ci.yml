name: Website CI

# Website checks use the npm lockfile and Node toolchain. Keep them separate
# from the root Bun/Flox app CI so each path runs only the relevant checks.
on:
  pull_request:
    paths:
      - "website/**"
      - "vercel.json"
      - ".github/workflows/website-ci.yml"
  push:
    branches: [master]
    paths:
      - "website/**"
      - "vercel.json"
      - ".github/workflows/website-ci.yml"

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  website-ci:
    name: website-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
