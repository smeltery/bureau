  <!-- Pre-paint theme resolution so the demo iframe doesn't flash the
       wrong mode before the JS bundle and ThemeProvider mount. Mirrors
       the logic in ui/store.tsx (getInitialThemeId + ThemeProvider). -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("bureau-theme");
        var theme =
          saved ||
          (window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark");
        var lightThemes = ["light", "solarized-light"];
        var mode = lightThemes.indexOf(theme) >= 0 ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.setAttribute("data-theme-mode", mode);
      } catch (e) {}
    })();
  </script>
  <style>
    body { margin: 0; background: #0a0e16; }
    [data-theme-mode="light"] body { background: #f0f2f6; }
  </style>
